name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check the vendored bytes are the pinned bytes
        run: sha256sum -c PROVENANCE.sha256

      - name: Reproduce the published vector sets
        run: |
          PYTHONPATH=src python3 -m evidence_record_consumer vectors \
            vectors/evidence-record-vectors-v0.1.json \
            vectors/evidence-appraisal-vectors-v0.1.json \
            --samples samples

      - name: Tests
        run: |
          python -m pip install --quiet pytest
          PYTHONPATH=src python3 -m pytest tests -q
